name: Draft Coach build

# Every push to main rebuilds the desktop app and publishes it as the "draft-coach-latest"
# release, so the download link never changes:
#   https://github.com/Tanrs12/intent-parse-bot/releases/latest/download/FlexersDraftCoach.zip
# Pushes to dev build the zip as a workflow artifact only.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-draftcoach.txt

      - name: Test
        run: python -m pytest -q tests

      - name: Build the desktop app
        run: python build_exe.py

      # Smoke-test the FROZEN executable, not just the source test suite.
      # This catches missing engine modules before publishing an unusable update.
      - name: Verify packaged application starts
        shell: pwsh
        run: |
          # The exe is a windowed (no console) build, so there is no --help text to read. Start it as
          # a server, wait for it to answer, then make it build a game plan: that exercises the bundled
          # engine, data files and team roster end to end before anything is published.
          $app = ".\dist\FlexersDraftCoach"
          $p = Start-Process -FilePath "$app\FlexersDraftCoach.exe" -WorkingDirectory $app -PassThru `
                 -ArgumentList '--no-update','--no-lcu','--no-auto-sync','--no-bridge','--port','8901','--load','loadfiles\flexers-team.json'
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8901/api/config
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          $plan = $null
          if ($ok) {
            for ($i = 0; $i -lt 30 -and -not $plan; $i++) {
              try {
                $players = (Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:8901/api/gameplan).players
                if ($players.Count -ge 5) {
                  $ids = @($players | Select-Object -First 5 | ForEach-Object { $_.user_id })
                  $body = @{ players = $ids } | ConvertTo-Json -Compress
                  $plan = Invoke-RestMethod -Method Post -TimeoutSec 120 -ContentType 'application/json' -Body $body http://127.0.0.1:8901/api/gameplan
                } else { Start-Sleep -Seconds 1 }
              } catch { Start-Sleep -Seconds 1 }
            }
          }
          Get-Content "$app\var\draftcoach.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { throw "Packaged Draft Coach did not serve /api/config within 120 s." }
          if (-not $plan -or $plan.recommendations.Count -lt 1) { throw "Packaged Draft Coach could not build a game plan (engine or data missing from the bundle)." }
          Write-Host ("Packaged app served a game plan: {0} drafts in {1} ms" -f $plan.recommendations.Count, $plan.elapsed_ms)

      # Run the frozen app for real (simulated champion select, no League client): the server, the
      # pages and the draft engine must answer before anything is published to the team.
      - name: Verify packaged application serves and drafts
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\FlexersDraftCoach\FlexersDraftCoach.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--simulate','--simulate-delay','0.5','--no-update','--no-auto-sync','--port','8891' -PassThru -RedirectStandardOutput sim.log -RedirectStandardError sim.err
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8891/api/config -TimeoutSec 3 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $ok) { Get-Content sim.log, sim.err; throw "Packaged Draft Coach did not start serving." }
            foreach ($page in '/', '/overlay', '/studio') {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8891$page" -TimeoutSec 10
              if ($r.StatusCode -ne 200) { throw "page $page returned $($r.StatusCode)" }
            }
            $body = '{"lineup":{},"count":2,"creative":true}'
            $gen = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8891/api/studio/generate -Body $body -ContentType 'application/json' -TimeoutSec 120
            if (-not $gen.drafts -or $gen.drafts.Count -lt 1) { throw "Draft Studio produced no drafts: $($gen.error)" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: FlexersDraftCoach
          path: dist/FlexersDraftCoach.zip
          if-no-files-found: error

      - name: Move the latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f draft-coach-latest
          git push -f origin draft-coach-latest

      - name: Publish the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: draft-coach-latest
          name: Flexers Draft Coach (latest)
          body: |
            Built from ${{ github.sha }} on ${{ github.event.head_commit.timestamp }}.
            Unzip, open the folder and double-click FlexersDraftCoach.exe. See START HERE.txt.
          files: dist/FlexersDraftCoach.zip
          make_latest: true
