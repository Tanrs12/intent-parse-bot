name: Security dependency audit

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Check Python dependencies
        run: python -m pip_audit -r requirements-draftcoach.txt --strict
